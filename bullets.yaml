# Bullet bank for tailor.py. Every bullet here is VERIFIED - wording comes from the
# master resume, the shipped company copies, or RESUME-DETAILS.md (authoritative).
# Do not add a bullet whose facts are not in RESUME-DETAILS.md.
#
# LaTeX rules still apply inside `text`: A\nk WS (not AWS), \pipe{} (not $|$),
# \% for percent, \textasciitilde for ~, no math mode.
#
# tags      -> matched against the focus weights (from --focus and/or the JD text)
# prior     -> tie-breaker; higher = shown in the general resume. 0 = only when a JD asks.
# group     -> at most one bullet per group is selected (alternate phrasings of one fact)
# verify    -> printed as a warning whenever the bullet is selected
# On hold / excluded (do NOT add): NBA betting analysis, any stock project, Countera.

roles:
