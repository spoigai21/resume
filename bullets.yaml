    title: Software Engineering Intern
    dates: June 2026 -- August 2026
    org: HerbsPro
    min: 1
    max: 3
    bullets:
      - id: hp-redis
        prior: 9
        tags: [backend, performance, database, caching, infra, sql]
        text: |-
          Cut MySQL query volume 60\% and product API p50 from 200\,ms to 90\,ms with a cache-aside Redis layer using event-driven invalidation across a 50,000+ SKU catalog.
      - id: hp-mcp
        prior: 8
        tags: [ai, llm, agents, backend, python, database, mcp]
        text: |-
          Built a Python MCP server (FastMCP) as the only access path for LLM agents into a legacy MySQL WMS: read tools for live stock, write tools emitting split-shipment pick tickets instead of raw table mutations.
      - id: hp-etl
        prior: 7
        tags: [data, etl, python, analytics, automation, ml]
        text: |-
          Built a Pandas \textbf{ETL pipeline} that normalized 150+ unstructured meeting notes into a fixed schema, extracting supplier terms into structured records.

  - id: adorus
    title: Software Engineer
    dates: May 2026 -- Present
    org: Adorus
    min: 2
    max: 4
    bullets:
      - id: ad-retrieval
        group: retrieval
        prior: 10
        tags: [ml, cv, ai, python, cloud, search, deep-learning]
        text: |-
          Built a \textbf{two-stage image-retrieval pipeline} (PyTorch, CLIP ViT-B/32) that crops queries to the worn-object region with YOLO11-pose (ONNX), moving the correct match from rank 3 to rank 1; inference runs in A\nk WS Lambda with catalog embeddings precomputed and ranked by cosine similarity in Postgres.
      - id: ad-retrieval-short
        group: retrieval
        prior: 0
        tags: [mobile, product, frontend]
        text: |-
          Shipped search by photo: a YOLO11-pose crop and CLIP embeddings moved the correct match from rank 3 to rank 1, with inference running in A\nk WS Lambda.
      - id: ad-platform
        group: architecture
        prior: 6
        tags: [fullstack, backend, frontend, java, cloud, infra, ownership, web]
        text: |-
          Built the production platform from scratch, solo (530 commits): a Java 21 Spring Boot backend of \textbf{24 bounded modules}, a React + Vite storefront, and PostgreSQL on A\nk WS behind CloudFront, owning every layer from schema to CDN.
      - id: ad-backend-service
        group: architecture
        prior: 5
        tags: [backend, java, database, infra, reliability, sql]
        text: |-
          Built and operate a Java 21 Spring Boot backend of \textbf{24 bounded modules} over PostgreSQL (A\nk WS RDS), with 80 Flyway migrations applied live with zero downtime.
      - id: ad-tax
        prior: 7
        tags: [backend, testing, payments, fintech, debugging]
        text: |-
          Fixed a \textbf{production} tax bug that folded tax into shipping totals, re-sourcing amounts from Stripe's API with 3 regression \textbf{tests}; hardened a Flyway migration against a cross-environment failure.
      - id: ad-s3
        prior: 6
        tags: [security, cloud, infra, aws, caching]
        text: |-
          Served private S3 imagery only through CloudFront with Origin Access Control and object-scoped IAM, \textbf{invalidating edge caches on delete} so removed assets stop serving before TTL expiry.
      - id: ad-cors
        prior: 4
        tags: [debugging, reliability, infra, networking, fullstack, web, operations]
        text: |-
          Diagnosed a \textbf{production} checkout outage from one customer screenshot: an apex-only CORS allowlist made every POST from the www host return 403, which CloudFront rewrote into a 200 carrying HTML; traced it through nginx logs to 97 failed requests from 19 visitors and fixed it at the CDN and origin.
      - id: ad-tests
        prior: 4
        tags: [testing, quality, ci, backend, fullstack, devtools]
        text: |-
          Built \textbf{590 automated tests} with PIT mutation testing in CI and a custom API-contract gate checking every frontend /api call against the backend's request mappings, catching route drift at review time.
      - id: ad-tryon-gemini
        group: tryon
        prior: 5
        tags: [ai, genai, ml, llm]
        text: |-
          Shipped AI virtual try-on on a reference-conditioned Gemini model at \textasciitilde\$0.05/image, with measurement-driven prompting that parses per-item dimensions into true-to-life scale and physically accurate drape.
      - id: ad-tryon-product
        group: tryon
        prior: 0
        tags: [frontend, mobile, product, fullstack, privacy]
        text: |-
          Shipped an \textbf{AI try-on feature} end to end: photo upload and live camera capture in React, asynchronous generation jobs, and a credit system, with a guarantee that no customer photo is ever persisted.
      - id: ad-storefront
        prior: 0
        tags: [frontend, web, mobile, react, fullstack, seo]
        text: |-
          Built a \textbf{92-module React + Vite storefront} across 41 indexable routes, with client-side routing, a guest cart on a 30-day httpOnly cookie, and static metadata for crawlers and social scrapers that never execute JavaScript.
      - id: ad-lambda
        prior: 0
        tags: [deployment, cloud, infra, ml, reliability, serverless, aws]
        text: |-
          Deployed the CLIP embedder to A\nk WS Lambda as a container image with weights baked in, since the model needs \textasciitilde1.3\,GB resident against \textasciitilde258\,MB free on the EC2 host, where an OOM kill would take down the storefront.
      - id: ad-analytics
        prior: 0
        tags: [data, analytics, privacy, measurement]
        text: |-
          Built cookieless first-party analytics that counts every visitor (153 people and 794 page views in its first 20 days live) where GA4 cannot: only 32 of 153 accepted cookies, so GA4 saw roughly a fifth of real traffic.
      - id: ad-decompression
        prior: 0
        tags: [security, appsec, backend]
        text: |-
          Closed a \textbf{decompression-bomb} vulnerability in image upload (a 102\,KB PNG allocated 134\,MB on a 192\,MB heap) by reading headers first and subsampling, cutting it to 40\,MB; fixed X-Forwarded-For spoofing and added IPv6 /64-aware rate limits.
      - id: ad-webhook
        prior: 0
        tags: [payments, fintech, event-driven, backend, distributed]
        text: |-
          Created orders from Stripe's \textbf{checkout.session.completed webhook} rather than the client redirect, so a closed tab never loses a paid order; per-variant stock decrements only on paid orders.

